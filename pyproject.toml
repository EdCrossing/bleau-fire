[project]
name = "bleau-fire"
version = "0.1.0"
description = "Burn severity of the July 2026 Fontainebleau fire, mapped onto bouldering circuits"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=3.0.5",
    "pyproj>=3.6",
    "pystac-client>=0.8",
    "rasterio>=1.3",
    "requests>=2.32",
    "shapely>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bleau_fire"]
